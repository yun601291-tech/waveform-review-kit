name: Test and demo screenshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q app.py tools tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional browser dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture real UI with synthetic demo data
        run: python tools/capture_demo.py --output demo-screenshot.png
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: waveform-review-synthetic-demo
          path: demo-screenshot.png
          if-no-files-found: error
